<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SlingCraft</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            corePlugins: { preflight: false },
            darkMode: 'media',
        }
    </script>
    <style>
        /* Theme colors using CSS custom properties */
        :root {
            --bg-color: #0a0a0f;
            --text-color: #ffffff;
            --text-muted: #888888;
            --text-heading: #aaaaaa;
            --accent-color: #88aaff;
            --panel-bg: rgba(26, 26, 36, 0.9);
            --panel-border: #333333;
            --button-bg: rgba(42, 42, 58, 0.9);
            --button-hover: rgba(58, 58, 74, 0.9);
            --button-active-bg: #4466aa;
            --button-active-border: #5577bb;
            --selection-stroke: white;
            --hover-stroke: rgba(255, 255, 255, 0.5);
            --com-color: rgba(255, 255, 255, 0.5);
            --grid-color: #888888;
            --outline-mix: white;
            --outline-planet-pct: 50%;
            --trajectory-mix: white;
            /* Transfer drag: hunting, then locked onto a destination */
            --drag-line: #fbbf24;
            --drag-line-locked: #34d399;
        }

        @media (prefers-color-scheme: light) {
            :root {
                --bg-color: #f8f7f5;
                --text-color: #1a1a2e;
                --text-muted: #555555;
                --text-heading: #444444;
                --accent-color: #3366cc;
                --panel-bg: rgba(255, 255, 255, 0.9);
                --panel-border: #cccccc;
                --button-bg: rgba(255, 255, 255, 0.9);
                --button-hover: rgba(240, 240, 245, 0.95);
                --button-active-bg: #5588dd;
                --button-active-border: #4477cc;
                --selection-stroke: #1a1a2e;
                --hover-stroke: rgba(26, 26, 46, 0.5);
                --com-color: rgba(26, 26, 46, 0.5);
                --grid-color: #8b7355;
                --outline-mix: black;
                --outline-planet-pct: 80%;
                --trajectory-mix: black;
                /* Darker on a light ground, where the neons wash out */
                --drag-line: #d97706;
                --drag-line-locked: #059669;
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            /* Prevent double-tap zoom on the entire page */
            touch-action: manipulation;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            height: 100vh;
            position: relative;
            /* Prevent double-tap zoom */
            touch-action: manipulation;
        }

        #game-svg {
            width: 100%;
            height: 100%;
            display: block;
            background-color: var(--bg-color);
            touch-action: none;
        }

        /* Grid lines */
        .grid-line {
            stroke: var(--grid-color);
            fill: none;
            pointer-events: none;
        }

        /* Body styling */
        .body-glow {
            pointer-events: none;
        }

        .body-circle {
            cursor: pointer;
            transition: filter 0.15s ease;
            stroke-width: 1;
        }

        .body-circle:hover {
            filter: brightness(1.2);
        }

        .body-circle.selected {
            stroke-width: 3;
        }

        .body-label {
            fill: var(--text-color);
            font-size: 12px;
            text-anchor: middle;
            pointer-events: none;
            user-select: none;
        }

        /* Craft parked at a body. This is the whole depiction of a fleet at rest, so it
           is sized to be read at a glance rather than to sit politely beside the name —
           it is the number the player is actually playing with. */
        .body-craft-count {
            fill: var(--text-color);
            font-size: 22px;
            font-weight: 600;
            font-family: monospace;
            pointer-events: none;
            user-select: none;
            /* Outlined in the page colour so the number holds up over grid lines,
               trajectories and other bodies. paint-order puts the stroke behind the
               fill, so the outline grows outward and never eats into the glyphs. */
            paint-order: stroke;
            stroke: var(--bg-color);
            stroke-width: 4px;
            stroke-linejoin: round;
        }

        .center-of-mass {
            fill: var(--com-color);
        }

        /* Trajectory paths */
        .trajectory-path {
            fill: none;
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            pointer-events: none;
        }

        /* Floating UI elements */
        .ui-overlay {
            position: absolute;
            pointer-events: none;
        }

        .ui-overlay > * {
            pointer-events: auto;
        }

        /* Title - upper left */
        #title {
            position: absolute;
            top: 20px;
            left: 20px;
            color: var(--accent-color);
            font-size: 12px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(136, 170, 255, 0.5);
            touch-action: none;
        }

        @media (prefers-color-scheme: light) {
            #title {
                text-shadow: 0 0 10px rgba(51, 102, 204, 0.3);
            }
        }

        /* Energy - under title */
        #energy-display {
            position: absolute;
            top: 38px;
            left: 20px;
            font-size: 9px;
            touch-action: none;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
        }

        #energy-display:hover {
            color: var(--accent-color);
        }

        /* Body details dropdown - below energy display */
        #body-details-dropdown {
            position: absolute;
            top: 55px;
            left: 20px;
            font-size: 7.8px;
            overflow: hidden;
            max-height: 0;
            opacity: 0;
            transition: max-height 0.25s ease, opacity 0.2s ease;
        }

        #body-details-dropdown.expanded {
            max-height: 150px;
            opacity: 0.7;
        }

        #body-details-dropdown .info-row {
            font-size: 7.8px;
            margin-bottom: 2px;
            gap: 10px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
            font-size: 13px;
            gap: 20px;
        }

        .info-label {
            color: var(--text-muted);
        }

        .info-value {
            color: var(--text-color);
            font-family: monospace;
        }

        /* Body info panel - lower left */
        #selected-body-info {
            position: absolute;
            /* Same 66px as #transfer-controls-panel: both live in the lower left
               and both have to clear the corner buttons, and sharing the offset
               means the panel that replaces this one during a transfer appears
               in the same place instead of jumping. */
            bottom: 66px;
            left: 20px;
            background-color: var(--panel-bg);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--panel-border);
            min-width: 200px;
            box-sizing: border-box;
            touch-action: none;
        }

        #selected-body-info h3 {
            margin-bottom: 10px;
            color: var(--accent-color);
            font-size: 14px;
        }

        .body-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
            vertical-align: middle;
        }

        /* ===== Transfer drag ===== */
        /* The rubber band from the source body to wherever the finger is. Amber
           while it is hunting, emerald once it is over a body it can drop on. */
        #transfer-drag-line {
            stroke: var(--drag-line);
            stroke-width: 2;
            stroke-dasharray: 6 5;
            stroke-linecap: round;
            pointer-events: none;
        }

        #transfer-drag-line.locked {
            stroke: var(--drag-line-locked);
            stroke-width: 3;
            stroke-dasharray: none;
        }

        /* Has to out-read the body's own outline and the .selected ring, since
           this is the one thing telling you where the craft would actually go. */
        .body-circle.drag-target {
            stroke: var(--drag-line-locked);
            stroke-width: 5;
            filter: drop-shadow(0 0 6px var(--drag-line-locked));
        }

        #transfer-hint {
            margin-top: 6px;
            font-size: 11px;
            line-height: 1.4;
            color: var(--drag-line);
        }

        #transfer-hint.waiting {
            color: var(--text-muted);
        }

        #body-lore {
            margin-top: 8px;
            font-size: 11px;
            line-height: 1.45;
            color: var(--text-muted);
            max-width: 30ch;
        }

        /* Controls - upper right corner */
        #controls {
            position: absolute;
            top: 10px;
            right: 10px;
            touch-action: none;
        }

        /* Time scrub button container - lower right corner */
        #time-scrub-container {
            position: absolute;
            bottom: 10px;
            right: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            touch-action: none;
        }

        button {
            background-color: var(--button-bg);
            color: var(--text-color);
            border: 1px solid var(--panel-border);
            border-radius: 4px;
            cursor: pointer;
            margin-left: 8px;
            font-size: 32px;
            width: 48px;
            height: 48px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
            vertical-align: top;
        }

        button:hover {
            background-color: var(--button-hover);
        }

        button.active {
            background-color: var(--button-active-bg);
            border-color: var(--button-active-border);
            color: #ffffff;
        }

        /* Controls popover */
        #controls-popover {
            position: relative;
            display: inline-block;
            vertical-align: top;
            margin-left: 8px;
        }

        .popover-content {
            background-color: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        @media (prefers-color-scheme: light) {
            .popover-content {
                box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            }
        }

        .popover-item {
            transition: background-color 0.15s ease;
            border-radius: 8px;
        }

        .popover-item:hover {
            background-color: var(--button-hover);
        }

        .popover-item .item-name {
            color: var(--text-color);
            font-weight: 600;
        }

        .popover-item .item-desc {
            color: var(--text-muted);
            font-size: 12px;
            margin-top: 4px;
        }

        #fit-all-badge {
            background-color: rgba(68, 102, 170, 0.25);
            color: var(--accent-color);
            font-size: 10px;
            font-weight: 600;
            padding: 1px 8px;
            border-radius: 9999px;
        }

        #fit-all-item.active {
            background-color: rgba(68, 102, 170, 0.1);
        }

        @media (prefers-color-scheme: light) {
            #fit-all-badge {
                background-color: rgba(51, 102, 204, 0.15);
            }

            #fit-all-item.active {
                background-color: rgba(51, 102, 204, 0.08);
            }
        }

        /* Time scrub button */
        #time-scrub-btn {
            font-size: 24px;
        }

        #time-scrub-btn.active {
            background-color: var(--button-active-bg);
            border-color: var(--button-active-border);
            color: #ffffff;
        }

        /* To-scale toggle: same treatment as the clock, since they are peers */
        #true-scale-btn {
            font-size: 24px;
        }

        #true-scale-btn.active {
            background-color: var(--button-active-bg);
            border-color: var(--button-active-border);
            color: #ffffff;
        }

        /* Time scrub panel */
        #time-scrub-panel {
            display: none;
            position: absolute;
            bottom: 72px;
            right: 10px;
            z-index: 100;
            touch-action: none;
        }

        #time-scrub-panel.visible {
            display: block;
        }

        #time-scrub-caret {
            position: absolute;
            bottom: -8px;
            right: 14px;
            width: 0;
            height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-top: 8px solid var(--panel-border);
            z-index: 1;
        }

        #time-scrub-caret::after {
            content: '';
            position: absolute;
            top: -9px;
            left: -7px;
            width: 0;
            height: 0;
            border-left: 7px solid transparent;
            border-right: 7px solid transparent;
            border-top: 7px solid var(--panel-bg);
        }

        #time-scrub-content {
            background-color: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        #time-scrub-label {
            font-size: 14px;
            font-family: monospace;
            color: var(--accent-color);
            text-align: center;
        }

        #time-wheel {
            cursor: grab;
            touch-action: none;
        }

        #time-wheel:active {
            cursor: grabbing;
        }

        /* Squadron count label */
        .squadron-count {
            fill: white;
            font-family: monospace;
            pointer-events: none;
        }

        @media (prefers-color-scheme: light) {
            .squadron-count {
                fill: #1a1a2e;
            }
        }

        /* Craft styling */
        .craft-dot {
            fill: white;
        }

        .craft-dot.in-transit {
            cursor: pointer;
        }

        .craft-dot.in-transit:hover {
            filter: brightness(1.3);
        }

        .craft-dot.selected {
            stroke: var(--selection-stroke);
            stroke-width: 2;
        }

        @media (prefers-color-scheme: light) {
            .craft-dot {
                fill: #1a1a2e;
            }
        }

        .craft-dot.free {
            animation: blink 0.5s ease-in-out infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* Craft trajectory styling */
        .craft-trajectory {
            stroke: white;
            stroke-width: 2;
        }

        .craft-trajectory.selected {
            stroke-width: 3;
        }

        /* Craft trajectory hit area (invisible, for click detection) */
        .craft-trajectory-hit-area {
            pointer-events: none;
        }

        .craft-trajectory-hit-area.in-transit {
            pointer-events: stroke;
            cursor: pointer;
        }

        @media (prefers-color-scheme: light) {
            .craft-trajectory {
                stroke: #1a1a2e;
            }
        }

        /* The fan of candidate transfers, one path per viable release angle. Drawn faint
           so that twenty of them read as a spread of options rather than a thicket, with
           the one under the finger brought forward. */
        .fan-path {
            stroke: var(--accent-color);
            stroke-width: 1.5;
            opacity: 0.35;
            stroke-linecap: round;
            pointer-events: none;
        }

        .fan-path.highlighted {
            stroke: var(--text-color);
            stroke-width: 3;
            opacity: 1;
        }

        .fan-label text {
            fill: var(--text-color);
            font-size: 13px;
            font-family: monospace;
            font-weight: 600;
            pointer-events: none;
            user-select: none;
        }

        .fan-label rect {
            fill: var(--panel-bg);
            stroke: var(--panel-border);
            stroke-width: 1;
        }

        /* Launch button in info panel */
        #launch-btn {
            display: block;
            width: 100%;
            background-color: var(--button-active-bg);
            color: #ffffff;
            border: 1px solid var(--button-active-border);
            border-radius: 4px;
            padding: 8px 16px;
            margin-left: 0;
            margin-bottom: 12px;
            cursor: pointer;
            font-size: 14px;
            height: auto;
        }

        #launch-btn:hover {
            background-color: var(--accent-color);
            color: #ffffff;
        }

        /* Build craft button - compact inline style */
        #build-craft-btn {
            width: auto;
            height: auto;
            font-size: 11px;
            padding: 2px 8px;
            margin-left: auto;
            background-color: var(--button-bg);
            border: 1px solid var(--panel-border);
            border-radius: 3px;
            color: var(--text-color);
        }

        #build-craft-btn:hover {
            background-color: var(--button-hover);
        }

        /* Schedule launch button */
        #schedule-launch-btn {
            background-color: var(--button-active-bg);
            color: #ffffff;
            border: 1px solid var(--button-active-border);
            border-radius: 4px;
            cursor: pointer;
        }

        #schedule-launch-btn:hover:not(:disabled) {
            background-color: var(--accent-color);
            color: #ffffff;
        }

        #schedule-launch-btn:disabled {
            background-color: var(--button-bg);
            color: var(--text-muted);
            border-color: var(--panel-border);
            cursor: not-allowed;
            opacity: 0.6;
        }

        /* Cancel transfer button */
        #cancel-transfer-btn {
            background-color: var(--button-bg);
            color: var(--text-color);
            border: 1px solid var(--panel-border);
            border-radius: 4px;
            cursor: pointer;
        }

        #cancel-transfer-btn:hover {
            background-color: var(--button-hover);
        }

        #transfer-readout {
            position: absolute;
            top: 66px;
            left: 10px;
            right: 10px;
            display: none;
            background-color: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            overflow: hidden;
            pointer-events: auto;
        }

        #trajectory-info-bar {
            display: flex;
            justify-content: center;
            /* Wrap rather than overflow: on a 320px screen the five readouts
               exceed one line and used to spill off both edges, clipping
               "Transfer" and the correction figure. */
            flex-wrap: wrap;
            gap: 4px 12px;
            padding: 6px 10px;
            font-size: 12px;
            font-family: monospace;
            color: var(--text-color);
        }

        #trajectory-info-bar > span {
            white-space: nowrap;
        }

        #trajectory-info-bar .info-label {
            color: var(--text-muted);
        }

        #trajectory-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            padding: 6px 4px;
        }

        #trajectory-controls button {
            margin-left: 0;
        }

        #trajectory-controls #cancel-transfer-btn,
        #trajectory-controls #schedule-launch-btn {
            flex: 1;
            width: auto;
            height: 44px;
            font-size: 13px;
            padding: 0 12px;
        }

        /* Transfer launch controls (caption + slider) */
        #transfer-launch-controls {
            padding: 0 4px 6px;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 4px;
        }

        #transfer-slider-row {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Names the control. Without this the filled track reads as a progress
           bar, and the bare end numbers read as slider bounds rather than
           "how many go" and "how many stay". */
        #transfer-qty-caption {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 8px;
            font-size: 13px;
            font-family: monospace;
            color: var(--text-color);
            padding: 0 2px;
        }

        #transfer-qty-caption strong {
            font-size: 15px;
            color: var(--accent-color);
        }

        #transfer-stay-note {
            font-size: 12px;
            color: var(--text-muted);
            white-space: nowrap;
        }

        #transfer-qty-slider {
            flex: 1;
            min-width: 60px;
            /* 44px is the smallest comfortable touch target on iOS. */
            height: 44px;
            /* Browsers give range inputs a default 2px side margin, which
               pushed the row 4px past its container. */
            margin: 0;
            cursor: pointer;
            accent-color: var(--accent-color);
        }

        #schedule-launch-btn {
            height: 44px;
            font-size: 13px;
            padding: 0 10px;
            /* Cancel the global button margin-left; as a flex item it pushed the
               row past its container. */
            margin-left: 0;
            background-color: var(--button-active-bg);
            color: #ffffff;
            border: 1px solid var(--button-active-border);
            border-radius: 4px;
            cursor: pointer;
        }

        #schedule-launch-btn:hover:not(:disabled) {
            background-color: var(--accent-color);
        }

        #schedule-launch-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Transfer controls panel (bottom, replaces body info during transfer) */
        #transfer-controls-panel {
            position: absolute;
            /* Sits ABOVE the corner buttons rather than beside them. Squeezing
               past them horizontally would have to clear 114px of buttons, and
               the quantity slider is the thing that pays: on a 320px screen its
               steps drop under a fingertip's width. Clearing them vertically
               instead (10px offset + 48px button + 8px) buys the panel the whole
               width, so the slider track is wider than it ever was. */
            bottom: 66px;
            left: 20px;
            right: 20px;
            display: none;
            background-color: var(--panel-bg);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--panel-border);
            box-sizing: border-box;
            pointer-events: auto;
            z-index: 11;
        }

        /* Commit info - inline next to title */
        #commit-info {
            font-size: 10px;
            font-weight: normal;
            color: var(--text-muted);
            cursor: pointer;
            margin-left: 6px;
        }

        #commit-info:hover {
            text-decoration: underline;
        }

        #commit-info .commit-ago {
            font-size: 10px;
        }

        /* Commit message modal */
        #commit-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        #commit-modal.visible {
            display: flex;
        }

        #commit-modal-content {
            background-color: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            padding: 20px;
            max-width: 500px;
            max-height: 60vh;
            width: 90%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #commit-modal-content .modal-tabs {
            display: flex;
            margin-bottom: 12px;
            border-bottom: 1px solid var(--panel-border);
            flex-shrink: 0;
        }

        #commit-modal-content .modal-tab {
            flex: 1;
            padding: 6px 4px;
            text-align: center;
            font-size: 12px;
            cursor: pointer;
            color: var(--text-muted);
            border-bottom: 2px solid transparent;
            transition: color 0.15s ease, border-color 0.15s ease;
            user-select: none;
            -webkit-user-select: none;
        }

        #commit-modal-content .modal-tab:hover {
            color: var(--text-color);
        }

        #commit-modal-content .modal-tab.active {
            color: var(--accent-color);
            border-bottom-color: var(--accent-color);
        }

        #commit-modal-content .modal-tab-body {
            display: none;
            overflow: hidden;
            flex: 1;
            min-height: 0;
        }

        #commit-modal-content .modal-tab-body.active {
            display: flex;
            flex-direction: column;
        }

        #commit-modal-content .modal-tab-body[data-modal-tab-body="build"].active {
            display: block;
            overflow-y: auto;
        }

        #commit-modal-content h3 {
            color: var(--accent-color);
            margin-bottom: 12px;
            font-size: 14px;
        }

        #commit-modal-content .commit-branch,
        #commit-modal-content .commit-date-line {
            font-family: monospace;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        #commit-modal-content .commit-hash {
            font-family: monospace;
            font-size: 12px;
            margin-bottom: 12px;
        }

        #commit-modal-content .commit-hash a {
            color: var(--accent-color);
            text-decoration: none;
        }

        #commit-modal-content .commit-hash a:hover {
            text-decoration: underline;
        }

        #commit-modal-content .commit-message {
            font-size: 13px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
        }

        #log-viewer {
            font-family: monospace;
            font-size: 11px;
            line-height: 1.4;
            white-space: pre-wrap;
            word-break: break-all;
            color: var(--text-color);
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--panel-border);
            border-radius: 4px;
            padding: 6px;
            flex: 1;
            min-height: 80px;
            overflow-y: auto;
            margin-bottom: 8px;
        }

        #copy-logs-btn {
            display: block;
            flex-shrink: 0;
            padding: 6px 12px;
            background-color: var(--button-bg);
            color: var(--text-color);
            border: 1px solid var(--panel-border);
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            width: auto;
            height: auto;
        }

        #copy-logs-btn:hover {
            background-color: var(--button-hover);
        }


    </style>
</head>
<body>
    <svg id="game-svg">
        <defs>
            <!-- Glow filters for each body will be added dynamically -->
            <!-- Arrowhead marker for correction boost direction -->
            <marker id="correction-arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                <polygon points="0 0, 10 3.5, 0 7" fill="red" />
            </marker>
        </defs>
        <g id="grid-layer"></g>
        <g id="trajectories-layer"></g>
        <g id="bodies-layer"></g>
        <g id="ui-layer"></g>
    </svg>

    <!-- Title + commit info - upper left -->
    <div id="title">SlingCraft <span id="commit-info" class="loading"></span></div>

    <!-- Energy + Controls - upper right -->
    <div id="energy-display">
        <span class="info-label">E:</span>
        <span class="info-value" id="total-energy">0</span>
    </div>

    <div id="body-details-dropdown">
    </div>

    <!-- There is no transfer menu: the map is the picker. Tap a body to select
         it, then drag from it to another body to plan a transfer between them.
         The drag rubber band is #transfer-drag-line, created by game.js. -->

    <!-- Body info - lower left (shown when body selected) -->
    <div id="selected-body-info">
    </div>

    <!-- Transfer readout. A slim bar pinned to the top, deliberately apart from the
         controls at the bottom: the candidate routes are drawn across the map itself
         and picked by dragging over them, so the middle of the screen has to stay
         clear. Stacking the readout onto the bottom panel made it tall enough to sit
         on top of the very curves it describes. -->
    <div id="transfer-readout">
        <div id="trajectory-info-bar"></div>
    </div>

    <!-- Transfer controls panel (bottom, shown during searching/ready). Cancel and
         Launch share a row rather than stacking: this panel and the readout above it
         bracket the map the fan is drawn on, so every row it does not need is map the
         player gets back to drag over. -->
    <div id="transfer-controls-panel">
        <div id="transfer-launch-controls" style="display: none;">
            <div id="transfer-qty-caption">
                <span>Send <strong id="transfer-launch-label">0</strong> of <span id="transfer-avail-label">0</span></span>
                <span id="transfer-stay-note"><span id="transfer-stay-label">0</span> stay</span>
            </div>
            <div id="transfer-slider-row">
                <input type="range" id="transfer-qty-slider" min="0" max="1" value="0">
            </div>
        </div>
        <div id="trajectory-controls">
            <button id="cancel-transfer-btn">Cancel</button>
            <button id="schedule-launch-btn" disabled>Launch</button>
        </div>
    </div>

    <!-- Controls - upper right -->
    <div id="controls">
        <div id="controls-popover">
            <button id="popover-trigger" type="button" title="More controls">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" style="width: 20px; height: 20px;">
                    <path fill-rule="evenodd" d="M5.22 8.22a.75.75 0 0 1 1.06 0L10 11.94l3.72-3.72a.75.75 0 1 1 1.06 1.06l-4.25 4.25a.75.75 0 0 1-1.06 0L5.22 9.28a.75.75 0 0 1 0-1.06Z" clip-rule="evenodd" />
                </svg>
            </button>
            <div id="popover-panel" class="absolute right-0 z-10 mt-2 hidden w-72 opacity-0 translate-y-1 transition-all duration-200 ease-out">
                <div class="popover-content p-3 text-sm">
                    <div id="reset-item" role="button" tabindex="0" class="popover-item cursor-pointer p-3">
                        <div class="item-name">Reset</div>
                        <p class="item-desc">Refresh and re-render the simulation from its initial state</p>
                    </div>
                    <div id="fit-all-item" role="button" tabindex="0" class="popover-item cursor-pointer p-3">
                        <div class="flex items-center gap-2">
                            <span class="item-name">Fit All</span>
                            <span id="fit-all-badge" class="hidden">Active</span>
                        </div>
                        <p class="item-desc">Auto-center and zoom to show all planetary bodies</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Lower right controls. The time-scrub panel anchors to the right edge, so the
         clock stays rightmost and anything new goes to its left. -->
    <div id="time-scrub-container">
        <button id="true-scale-btn" title="To-scale view: true radii and true distances">📏</button>
        <button id="time-scrub-btn" title="Time Scrub">🕐</button>
    </div>

    <!-- Time scrub panel -->
    <div id="time-scrub-panel">
        <div id="time-scrub-caret"></div>
        <div id="time-scrub-content">
            <div id="time-scrub-label">+0.000s</div>
            <svg id="time-wheel" width="120" height="120" viewBox="0 0 120 120"></svg>
        </div>
    </div>

    <!-- Commit message modal -->
    <div id="commit-modal">
        <div id="commit-modal-content">
            <div class="modal-tabs">
                <div class="modal-tab active" data-modal-tab="build">Build Info</div>
                <div class="modal-tab" data-modal-tab="logs">Logs</div>
            </div>
            <div class="modal-tab-body active" data-modal-tab-body="build">
                <div class="commit-branch"></div>
                <div class="commit-date-line"></div>
                <div class="commit-hash"></div>
                <div class="commit-message"></div>
            </div>
            <div class="modal-tab-body" data-modal-tab-body="logs">
                <div id="log-viewer"></div>
                <button id="copy-logs-btn">Copy All Logs</button>
            </div>
        </div>
    </div>

    <script src="game.js?v=3"></script>
</body>
</html>
