<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SlingCraft</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        /* Theme colors using CSS custom properties */
        :root {
            --bg-color: #0a0a0f;
            --text-color: #ffffff;
            --text-muted: #888888;
            --text-heading: #aaaaaa;
            --accent-color: #88aaff;
            --panel-bg: rgba(26, 26, 36, 0.9);
            --panel-border: #333333;
            --button-bg: rgba(42, 42, 58, 0.9);
            --button-hover: rgba(58, 58, 74, 0.9);
            --button-active-bg: #4466aa;
            --button-active-border: #5577bb;
            --selection-stroke: white;
            --hover-stroke: rgba(255, 255, 255, 0.5);
            --com-color: rgba(255, 255, 255, 0.5);
            --grid-color: #888888;
            --outline-mix: white;
            --outline-planet-pct: 50%;
            --trajectory-mix: white;
        }

        @media (prefers-color-scheme: light) {
            :root {
                --bg-color: #f8f7f5;
                --text-color: #1a1a2e;
                --text-muted: #555555;
                --text-heading: #444444;
                --accent-color: #3366cc;
                --panel-bg: rgba(255, 255, 255, 0.9);
                --panel-border: #cccccc;
                --button-bg: rgba(255, 255, 255, 0.9);
                --button-hover: rgba(240, 240, 245, 0.95);
                --button-active-bg: #5588dd;
                --button-active-border: #4477cc;
                --selection-stroke: #1a1a2e;
                --hover-stroke: rgba(26, 26, 46, 0.5);
                --com-color: rgba(26, 26, 46, 0.5);
                --grid-color: #8b7355;
                --outline-mix: black;
                --outline-planet-pct: 80%;
                --trajectory-mix: black;
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            /* Prevent double-tap zoom on the entire page */
            touch-action: manipulation;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            height: 100vh;
            position: relative;
            /* Prevent double-tap zoom */
            touch-action: manipulation;
        }

        #game-svg {
            width: 100%;
            height: 100%;
            display: block;
            background-color: var(--bg-color);
            touch-action: none;
        }

        /* Grid lines */
        .grid-line {
            stroke: var(--grid-color);
            fill: none;
            pointer-events: none;
        }

        /* Body styling */
        .body-glow {
            pointer-events: none;
        }

        .body-circle {
            cursor: pointer;
            transition: filter 0.15s ease;
            stroke-width: 1;
        }

        .body-circle:hover {
            filter: brightness(1.2);
        }

        .body-circle.selected {
            stroke-width: 3;
        }

        .body-label {
            fill: var(--text-color);
            font-size: 12px;
            text-anchor: middle;
            pointer-events: none;
            user-select: none;
        }

        .center-of-mass {
            fill: var(--com-color);
        }

        /* Trajectory paths */
        .trajectory-path {
            fill: none;
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            pointer-events: none;
        }

        /* Floating UI elements */
        .ui-overlay {
            position: absolute;
            pointer-events: none;
        }

        .ui-overlay > * {
            pointer-events: auto;
        }

        /* Title - upper left */
        #title {
            position: absolute;
            top: 20px;
            left: 20px;
            color: var(--accent-color);
            font-size: 12px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(136, 170, 255, 0.5);
            touch-action: none;
        }

        @media (prefers-color-scheme: light) {
            #title {
                text-shadow: 0 0 10px rgba(51, 102, 204, 0.3);
            }
        }

        /* Energy - under title */
        #energy-display {
            position: absolute;
            top: 38px;
            left: 20px;
            font-size: 9px;
            touch-action: none;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
        }

        #energy-display:hover {
            color: var(--accent-color);
        }

        /* Body details dropdown - below energy display */
        #body-details-dropdown {
            position: absolute;
            top: 55px;
            left: 20px;
            font-size: 7.8px;
            overflow: hidden;
            max-height: 0;
            opacity: 0;
            transition: max-height 0.25s ease, opacity 0.2s ease;
        }

        #body-details-dropdown.expanded {
            max-height: 150px;
            opacity: 0.7;
        }

        #body-details-dropdown .info-row {
            font-size: 7.8px;
            margin-bottom: 2px;
            gap: 10px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
            font-size: 13px;
            gap: 20px;
        }

        .info-label {
            color: var(--text-muted);
        }

        .info-value {
            color: var(--text-color);
            font-family: monospace;
        }

        /* Body info panel - lower left */
        #selected-body-info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background-color: var(--panel-bg);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--panel-border);
            min-width: 200px;
            box-sizing: border-box;
            touch-action: none;
        }

        #selected-body-info h3 {
            margin-bottom: 10px;
            color: var(--accent-color);
            font-size: 14px;
        }

        .body-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
            vertical-align: middle;
        }

        /* Controls - upper right corner */
        #controls {
            position: absolute;
            top: 10px;
            right: 10px;
            touch-action: none;
        }

        /* Time scrub button container - lower right corner */
        #time-scrub-container {
            position: absolute;
            bottom: 10px;
            right: 10px;
            touch-action: none;
        }

        button {
            background-color: var(--button-bg);
            color: var(--text-color);
            border: 1px solid var(--panel-border);
            border-radius: 4px;
            cursor: pointer;
            margin-left: 8px;
            font-size: 32px;
            width: 48px;
            height: 48px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
            vertical-align: top;
        }

        button:hover {
            background-color: var(--button-hover);
        }

        button.active {
            background-color: var(--button-active-bg);
            border-color: var(--button-active-border);
            color: #ffffff;
        }

        /* Adjust reset symbol vertical alignment */
        #reset-btn {
            padding-bottom: 4px;
        }

        /* Time scrub button */
        #time-scrub-btn {
            font-size: 24px;
        }

        #time-scrub-btn.active {
            background-color: var(--button-active-bg);
            border-color: var(--button-active-border);
            color: #ffffff;
        }

        /* Time scrub panel */
        #time-scrub-panel {
            display: none;
            position: absolute;
            bottom: 72px;
            right: 10px;
            z-index: 100;
            touch-action: none;
        }

        #time-scrub-panel.visible {
            display: block;
        }

        #time-scrub-caret {
            position: absolute;
            bottom: -8px;
            right: 14px;
            width: 0;
            height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-top: 8px solid var(--panel-border);
            z-index: 1;
        }

        #time-scrub-caret::after {
            content: '';
            position: absolute;
            top: -9px;
            left: -7px;
            width: 0;
            height: 0;
            border-left: 7px solid transparent;
            border-right: 7px solid transparent;
            border-top: 7px solid var(--panel-bg);
        }

        #time-scrub-content {
            background-color: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        #time-scrub-label {
            font-size: 14px;
            font-family: monospace;
            color: var(--accent-color);
            text-align: center;
        }

        #time-wheel {
            cursor: grab;
            touch-action: none;
        }

        #time-wheel:active {
            cursor: grabbing;
        }

        /* Tabs in info panel */
        .info-tabs {
            display: flex;
            margin-bottom: 8px;
            border-bottom: 1px solid var(--panel-border);
        }

        .info-tab {
            flex: 1;
            padding: 6px 4px;
            text-align: center;
            font-size: 12px;
            cursor: pointer;
            color: var(--text-muted);
            border-bottom: 2px solid transparent;
            transition: color 0.15s ease, border-color 0.15s ease;
            user-select: none;
            -webkit-user-select: none;
            white-space: nowrap;
        }

        .info-tab:hover {
            color: var(--text-color);
        }

        .info-tab.active {
            color: var(--accent-color);
            border-bottom-color: var(--accent-color);
        }

        .info-tab-count {
            color: var(--text-muted);
            font-size: 11px;
        }

        /* Body list in info panel (when no body selected) */
        .body-list {
            height: 25vh;
            overflow-y: auto;
        }

        .body-list-item {
            display: flex;
            align-items: center;
            padding: 6px 8px;
            cursor: pointer;
            border-radius: 4px;
            transition: background-color 0.15s ease, color 0.15s ease;
        }

        .body-list-item:hover {
            background-color: var(--button-hover);
            color: var(--accent-color);
        }

        .body-list-item .body-indicator {
            flex-shrink: 0;
        }

        .body-list-item .body-name {
            font-size: 13px;
            flex: 1;
        }

        .body-list-item .body-craft-count {
            font-size: 12px;
            color: var(--text-color);
            font-weight: bold;
            margin-left: auto;
        }

        /* Squadron count label */
        .squadron-count {
            fill: white;
            font-family: monospace;
            pointer-events: none;
        }

        @media (prefers-color-scheme: light) {
            .squadron-count {
                fill: #1a1a2e;
            }
        }

        /* Craft styling */
        .craft-dot {
            fill: white;
        }

        .craft-dot.in-transit {
            cursor: pointer;
        }

        .craft-dot.in-transit:hover {
            filter: brightness(1.3);
        }

        .craft-dot.selected {
            stroke: var(--selection-stroke);
            stroke-width: 2;
        }

        @media (prefers-color-scheme: light) {
            .craft-dot {
                fill: #1a1a2e;
            }
        }

        .craft-dot.free {
            animation: blink 0.5s ease-in-out infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* Craft trajectory styling */
        .craft-trajectory {
            stroke: white;
            stroke-width: 2;
        }

        .craft-trajectory.selected {
            stroke-width: 3;
        }

        /* Craft trajectory hit area (invisible, for click detection) */
        .craft-trajectory-hit-area {
            pointer-events: none;
        }

        .craft-trajectory-hit-area.in-transit {
            pointer-events: stroke;
            cursor: pointer;
        }

        @media (prefers-color-scheme: light) {
            .craft-trajectory {
                stroke: #1a1a2e;
            }
        }

        /* Launch button in info panel */
        #launch-btn {
            display: block;
            width: 100%;
            background-color: var(--button-active-bg);
            color: #ffffff;
            border: 1px solid var(--button-active-border);
            border-radius: 4px;
            padding: 8px 16px;
            margin-left: 0;
            margin-bottom: 12px;
            cursor: pointer;
            font-size: 14px;
            height: auto;
        }

        #launch-btn:hover {
            background-color: var(--accent-color);
            color: #ffffff;
        }

        /* Build craft button - compact inline style */
        #build-craft-btn {
            width: auto;
            height: auto;
            font-size: 11px;
            padding: 2px 8px;
            margin-left: auto;
            background-color: var(--button-bg);
            border: 1px solid var(--panel-border);
            border-radius: 3px;
            color: var(--text-color);
        }

        #build-craft-btn:hover {
            background-color: var(--button-hover);
        }

        /* Transfer button in info panel */
        #transfer-btn {
            display: block;
            width: 100%;
            background-color: var(--button-active-bg);
            color: #ffffff;
            border: 1px solid var(--button-active-border);
            border-radius: 4px;
            padding: 8px 16px;
            margin-left: 0;
            margin-bottom: 12px;
            cursor: pointer;
            font-size: 14px;
            height: auto;
        }

        #transfer-btn:hover:not(:disabled) {
            background-color: var(--accent-color);
            color: #ffffff;
        }

        #transfer-btn:disabled {
            background-color: var(--button-bg);
            color: var(--text-muted);
            border-color: var(--panel-border);
            cursor: not-allowed;
            opacity: 0.6;
        }

        /* Schedule launch button */
        #schedule-launch-btn {
            background-color: var(--button-active-bg);
            color: #ffffff;
            border: 1px solid var(--button-active-border);
            border-radius: 4px;
            cursor: pointer;
        }

        #schedule-launch-btn:hover:not(:disabled) {
            background-color: var(--accent-color);
            color: #ffffff;
        }

        #schedule-launch-btn:disabled {
            background-color: var(--button-bg);
            color: var(--text-muted);
            border-color: var(--panel-border);
            cursor: not-allowed;
            opacity: 0.6;
        }

        /* Cancel transfer button */
        #cancel-transfer-btn {
            background-color: var(--button-bg);
            color: var(--text-color);
            border: 1px solid var(--panel-border);
            border-radius: 4px;
            cursor: pointer;
        }

        #cancel-transfer-btn:hover {
            background-color: var(--button-hover);
        }

        /* Cancel button in destination selection panel */
        #cancel-dest-select-btn {
            display: block;
            width: 100%;
            background-color: var(--button-bg);
            color: var(--text-color);
            border: 1px solid var(--panel-border);
            border-radius: 4px;
            padding: 8px 16px;
            margin-left: 0;
            margin-top: 8px;
            cursor: pointer;
            font-size: 14px;
            height: auto;
        }

        #cancel-dest-select-btn:hover {
            background-color: var(--button-hover);
        }

        /* Trajectory plot panel */
        #trajectory-plot-container {
            position: absolute;
            top: 66px;
            left: 10px;
            right: 10px;
            display: none;
            background-color: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            overflow: hidden;
            pointer-events: auto;
        }

        #trajectory-info-bar {
            display: flex;
            justify-content: center;
            gap: 16px;
            padding: 6px 12px;
            font-size: 12px;
            font-family: monospace;
            color: var(--text-color);
        }

        #trajectory-info-bar .info-label {
            color: var(--text-muted);
        }

        #trajectory-plot {
            width: 100%;
            height: 105px;
            touch-action: none;
        }

        #trajectory-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            padding: 6px 4px;
        }

        #trajectory-controls button {
            margin-left: 0;
        }

        #trajectory-controls #traj-prev-btn,
        #trajectory-controls #traj-next-btn {
            width: 44px;
            height: 44px;
            font-size: 18px;
        }

        #trajectory-controls #cancel-transfer-btn {
            width: auto;
            height: 44px;
            font-size: 13px;
            padding: 0 12px;
        }

        /* Transfer launch controls (slider + launch button) */
        #transfer-launch-controls {
            padding: 6px 4px 4px;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 8px;
        }

        #transfer-slider-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        #transfer-stay-label,
        #transfer-launch-label {
            font-size: 12px;
            font-family: monospace;
            color: var(--text-color);
            white-space: nowrap;
            min-width: 24px;
            text-align: center;
        }

        #transfer-qty-slider {
            flex: 1;
            min-width: 60px;
            height: 24px;
            cursor: pointer;
            accent-color: var(--accent-color);
        }

        #schedule-launch-btn {
            width: 100%;
            height: 44px;
            font-size: 13px;
            padding: 0 10px;
            background-color: var(--button-active-bg);
            color: #ffffff;
            border: 1px solid var(--button-active-border);
            border-radius: 4px;
            cursor: pointer;
        }

        #schedule-launch-btn:hover:not(:disabled) {
            background-color: var(--accent-color);
        }

        #schedule-launch-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Transfer controls panel (bottom-left, replaces body info during transfer) */
        #transfer-controls-panel {
            position: absolute;
            bottom: 20px;
            left: 20px;
            display: none;
            background-color: var(--panel-bg);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--panel-border);
            box-sizing: border-box;
            pointer-events: auto;
        }

        /* Commit info - inline next to title */
        #commit-info {
            font-size: 10px;
            font-weight: normal;
            color: var(--text-muted);
            cursor: pointer;
            margin-left: 6px;
        }

        #commit-info:hover {
            text-decoration: underline;
        }

        #commit-info .commit-ago {
            font-size: 10px;
        }

        /* Commit message modal */
        #commit-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        #commit-modal.visible {
            display: flex;
        }

        #commit-modal-content {
            background-color: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            padding: 20px;
            max-width: 500px;
            max-height: 60vh;
            width: 90%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #commit-modal-content .modal-tabs {
            display: flex;
            margin-bottom: 12px;
            border-bottom: 1px solid var(--panel-border);
            flex-shrink: 0;
        }

        #commit-modal-content .modal-tab {
            flex: 1;
            padding: 6px 4px;
            text-align: center;
            font-size: 12px;
            cursor: pointer;
            color: var(--text-muted);
            border-bottom: 2px solid transparent;
            transition: color 0.15s ease, border-color 0.15s ease;
            user-select: none;
            -webkit-user-select: none;
        }

        #commit-modal-content .modal-tab:hover {
            color: var(--text-color);
        }

        #commit-modal-content .modal-tab.active {
            color: var(--accent-color);
            border-bottom-color: var(--accent-color);
        }

        #commit-modal-content .modal-tab-body {
            display: none;
            overflow-y: auto;
            flex: 1;
            min-height: 0;
        }

        #commit-modal-content .modal-tab-body.active {
            display: block;
        }

        #commit-modal-content h3 {
            color: var(--accent-color);
            margin-bottom: 12px;
            font-size: 14px;
        }

        #commit-modal-content .commit-branch,
        #commit-modal-content .commit-date-line {
            font-family: monospace;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        #commit-modal-content .commit-hash {
            font-family: monospace;
            font-size: 12px;
            margin-bottom: 12px;
        }

        #commit-modal-content .commit-hash a {
            color: var(--accent-color);
            text-decoration: none;
        }

        #commit-modal-content .commit-hash a:hover {
            text-decoration: underline;
        }

        #commit-modal-content .commit-message {
            font-size: 13px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
        }

        #log-viewer {
            font-family: monospace;
            font-size: 11px;
            line-height: 1.4;
            white-space: pre-wrap;
            word-break: break-all;
            color: var(--text-color);
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--panel-border);
            border-radius: 4px;
            padding: 6px;
            max-height: 40vh;
            overflow-y: auto;
            margin-bottom: 8px;
        }

        #copy-logs-btn {
            display: block;
            padding: 6px 12px;
            background-color: var(--button-bg);
            color: var(--text-color);
            border: 1px solid var(--panel-border);
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            width: auto;
            height: auto;
        }

        #copy-logs-btn:hover {
            background-color: var(--button-hover);
        }

        #commit-modal-content .close-btn {
            display: block;
            margin-top: 16px;
            padding: 8px 16px;
            background-color: var(--button-bg);
            color: var(--text-color);
            border: 1px solid var(--panel-border);
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            width: auto;
            height: auto;
        }

        #commit-modal-content .close-btn:hover {
            background-color: var(--button-hover);
        }

    </style>
</head>
<body>
    <svg id="game-svg">
        <defs>
            <!-- Glow filters for each body will be added dynamically -->
            <!-- Arrowhead marker for correction boost direction -->
            <marker id="correction-arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                <polygon points="0 0, 10 3.5, 0 7" fill="red" />
            </marker>
        </defs>
        <g id="grid-layer"></g>
        <g id="trajectories-layer"></g>
        <g id="bodies-layer"></g>
        <g id="ui-layer"></g>
    </svg>

    <!-- Title + commit info - upper left -->
    <div id="title">SlingCraft <span id="commit-info" class="loading"></span></div>

    <!-- Energy + Controls - upper right -->
    <div id="energy-display">
        <span class="info-label">E:</span>
        <span class="info-value" id="total-energy">0</span>
    </div>

    <div id="body-details-dropdown">
    </div>

    <!-- Body info - lower left (shown when body selected) -->
    <div id="selected-body-info">
    </div>

    <!-- Trajectory plot panel (top, full width: info bar + plot only) -->
    <div id="trajectory-plot-container">
        <div id="trajectory-info-bar"></div>
        <canvas id="trajectory-plot"></canvas>
    </div>

    <!-- Transfer controls panel (bottom-left, shown during searching/ready) -->
    <div id="transfer-controls-panel">
        <div id="trajectory-controls">
            <button id="cancel-transfer-btn">Cancel</button>
            <button id="traj-prev-btn" title="Previous launch time">&#x25C0;</button>
            <button id="traj-next-btn" title="Next launch time">&#x25B6;</button>
        </div>
        <div id="transfer-launch-controls" style="display: none;">
            <div id="transfer-slider-row">
                <span id="transfer-stay-label">0</span>
                <input type="range" id="transfer-qty-slider" min="0" max="1" value="0">
                <span id="transfer-launch-label">0</span>
            </div>
            <button id="schedule-launch-btn" disabled>Launch</button>
        </div>
    </div>

    <!-- Controls - upper right -->
    <div id="controls">
        <button id="reset-btn" title="Reset">↺</button>
        <button id="fit-all-btn" title="Fit All">⤢</button>
    </div>

    <!-- Time scrub - lower right -->
    <div id="time-scrub-container">
        <button id="time-scrub-btn" title="Time Scrub">🕐</button>
    </div>

    <!-- Time scrub panel -->
    <div id="time-scrub-panel">
        <div id="time-scrub-caret"></div>
        <div id="time-scrub-content">
            <div id="time-scrub-label">+0.000s</div>
            <svg id="time-wheel" width="120" height="120" viewBox="0 0 120 120"></svg>
        </div>
    </div>

    <!-- Commit message modal -->
    <div id="commit-modal">
        <div id="commit-modal-content">
            <div class="modal-tabs">
                <div class="modal-tab active" data-modal-tab="build">Build Info</div>
                <div class="modal-tab" data-modal-tab="logs">Logs</div>
            </div>
            <div class="modal-tab-body active" data-modal-tab-body="build">
                <div class="commit-branch"></div>
                <div class="commit-date-line"></div>
                <div class="commit-hash"></div>
                <div class="commit-message"></div>
            </div>
            <div class="modal-tab-body" data-modal-tab-body="logs">
                <div id="log-viewer"></div>
                <button id="copy-logs-btn">Copy All Logs</button>
            </div>
            <button class="close-btn">Close</button>
        </div>
    </div>

    <script src="game.js?v=3"></script>
</body>
</html>
